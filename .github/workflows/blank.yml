name: Run API Automation sut test

on:
  workflow_dispatch:
    inputs:
      bearerToken:
        description: "Bearer Token (enter token only, without 'Bearer ')"
        required: true
        type: string

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # Checkout repository
      # ==================================================
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # ==================================================
      # Setup Node.js
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      # ==================================================
      # Install Newman
      # ==================================================
      - name: Install Newman
        shell: bash
        run: |
          set -e

          npm install -g newman
          npm install -g newman-reporter-htmlextra

          sudo apt-get update
          sudo apt-get install -y jq

          echo "Newman version:"
          newman --version

          echo "jq version:"
          jq --version

      # ==================================================
      # Create reports directory
      # ==================================================
      - name: Create Reports Folder
        shell: bash
        run: |
          mkdir -p reports

      # ==================================================
      # Find Postman collection and environment
      # ==================================================
      - name: Find Postman Collection and Environment
        shell: bash
        run: |

          set -e

          API_AUTOMATION="$GITHUB_WORKSPACE/API Automation"

          echo "=========================================="
          echo "Searching Postman files"
          echo "=========================================="

          echo "Folder:"
          echo "$API_AUTOMATION"

          # ----------------------------------------------
          # Check API Automation folder
          # ----------------------------------------------

          if [ ! -d "$API_AUTOMATION" ]; then
            echo "❌ API Automation folder not found"
            exit 1
          fi

          # ----------------------------------------------
          # Find collection
          # ----------------------------------------------

          COLLECTION=$(find "$API_AUTOMATION" \
            -type f \
            -name "*.postman_collection.json" \
            | head -n 1)

          if [ -z "$COLLECTION" ]; then
            echo "❌ Postman collection not found"
            exit 1
          fi

          echo "✅ Collection found:"
          echo "$COLLECTION"

          # ----------------------------------------------
          # Find environment
          # ----------------------------------------------

          ENVIRONMENT=$(find "$API_AUTOMATION" \
            -type f \
            -name "*.postman_environment.json" \
            | head -n 1)

          if [ -n "$ENVIRONMENT" ]; then

            echo "✅ Environment found:"
            echo "$ENVIRONMENT"

          else

            echo "⚠️ No Postman environment found"

          fi

          # ----------------------------------------------
          # Save variables
          # ----------------------------------------------

          echo "COLLECTION=$COLLECTION" >> "$GITHUB_ENV"
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"

      # ==================================================
      # Run Newman
      # ==================================================
      - name: Run Newman Collection
        id: newman
        continue-on-error: true
        shell: bash

        env:
          # GitHub workflow_dispatch input
          ACCESS_TOKEN: ${{ inputs.bearerToken }}

        run: |

          echo "=========================================="
          echo "Running Newman"
          echo "=========================================="

          # ----------------------------------------------
          # Check token
          # ----------------------------------------------

          if [ -z "$ACCESS_TOKEN" ]; then

            echo "❌ Bearer token is empty."

            echo "NEWMAN_EXIT_CODE=1" >> "$GITHUB_ENV"

            exit 0

          fi

          # ----------------------------------------------
          # Mask token
          # ----------------------------------------------

          echo "::add-mask::$ACCESS_TOKEN"

          echo "✅ Bearer token received."
          echo "Token value will not be printed."

          # ----------------------------------------------
          # Remove accidental "Bearer " prefix
          # ----------------------------------------------

          ACCESS_TOKEN="${ACCESS_TOKEN#Bearer }"

          # Mask again after transformation
          echo "::add-mask::$ACCESS_TOKEN"

          # ----------------------------------------------
          # Check collection
          # ----------------------------------------------

          if [ ! -f "$COLLECTION" ]; then

            echo "❌ Collection file not found:"
            echo "$COLLECTION"

            echo "NEWMAN_EXIT_CODE=1" >> "$GITHUB_ENV"

            exit 0

          fi

          # ----------------------------------------------
          # Run Newman
          # ----------------------------------------------

          if [ -n "$ENVIRONMENT" ] && [ -f "$ENVIRONMENT" ]; then

            echo "Using Postman environment:"
            echo "$ENVIRONMENT"

            newman run "$COLLECTION" \
              --environment "$ENVIRONMENT" \
              --env-var "BearerToken=$ACCESS_TOKEN" \
              --reporters cli,json,htmlextra \
              --reporter-json-export reports/report.json \
              --reporter-htmlextra-export reports/report.html

            NEWMAN_EXIT_CODE=$?

          else

            echo "⚠️ No Postman environment found."

            newman run "$COLLECTION" \
              --env-var "BearerToken=$ACCESS_TOKEN" \
              --reporters cli,json,htmlextra \
              --reporter-json-export reports/report.json \
              --reporter-htmlextra-export reports/report.html

            NEWMAN_EXIT_CODE=$?

          fi

          # ----------------------------------------------
          # Save Newman result
          # ----------------------------------------------

          echo ""
          echo "Newman exit code: $NEWMAN_EXIT_CODE"

          echo "NEWMAN_EXIT_CODE=$NEWMAN_EXIT_CODE" >> "$GITHUB_ENV"

          # Do not fail this step.
          # Final step handles workflow failure.
          exit 0

      # ==================================================
      # Generate GitHub Actions summary
      # ==================================================
      - name: Generate Newman Dashboard Summary
        if: always()
        shell: bash
        run: |

          echo "# API Automation Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # ----------------------------------------------
          # Check report
          # ----------------------------------------------

          if [ ! -f "reports/report.json" ]; then

            echo "❌ Newman report was not generated." \
              >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "Newman may have failed before creating the report." \
              >> "$GITHUB_STEP_SUMMARY"

            exit 0

          fi

          # ----------------------------------------------
          # Read Newman statistics
          # ----------------------------------------------

          REQUESTS=$(jq -r \
            '.run.stats.requests.total // 0' \
            reports/report.json)

          FAILED_REQUESTS=$(jq -r \
            '.run.stats.requests.failed // 0' \
            reports/report.json)

          ASSERTIONS=$(jq -r \
            '.run.stats.assertions.total // 0' \
            reports/report.json)

          FAILED_ASSERTIONS=$(jq -r \
            '.run.stats.assertions.failed // 0' \
            reports/report.json)

          TESTS=$(jq -r \
            '.run.stats.tests.total // 0' \
            reports/report.json)

          FAILED_TESTS=$(jq -r \
            '.run.stats.tests.failed // 0' \
            reports/report.json)

          PREREQUEST=$(jq -r \
            '.run.stats.prerequests.total // 0' \
            reports/report.json)

          FAILED_PREREQUEST=$(jq -r \
            '.run.stats.prerequests.failed // 0' \
            reports/report.json)

          ITERATIONS=$(jq -r \
            '.run.stats.iterations.total // 0' \
            reports/report.json)

          AVG_TIME=$(jq -r \
            '.run.timings.responseAverage // 0' \
            reports/report.json)

          COLLECTION_NAME=$(jq -r \
            '.collection.info.name // "Unknown Collection"' \
            reports/report.json)

          # ----------------------------------------------
          # Create summary
          # ----------------------------------------------

          {
            echo "**Collection:** $COLLECTION_NAME"
            echo ""

            echo "| Metric | Total | Failed |"
            echo "|--------|------:|-------:|"
            echo "| Requests | $REQUESTS | $FAILED_REQUESTS |"
            echo "| Pre-request Scripts | $PREREQUEST | $FAILED_PREREQUEST |"
            echo "| Test Scripts | $TESTS | $FAILED_TESTS |"
            echo "| Assertions | $ASSERTIONS | $FAILED_ASSERTIONS |"

            echo ""

            echo "## Run Information"
            echo ""

            echo "- **Iterations:** $ITERATIONS"
            echo "- **Average Response Time:** ${AVG_TIME} ms"

            echo ""

            echo "## Result"
            echo ""

            if [ "$FAILED_ASSERTIONS" -eq 0 ] && \
               [ "$FAILED_REQUESTS" -eq 0 ]; then

              echo "✅ All API tests passed"

            else

              echo "❌ API tests failed"

            fi

            echo ""

            echo "## Failed Tests"
            echo ""

            if [ "$FAILED_ASSERTIONS" -eq 0 ]; then

              echo "No failed assertions."

            else

              echo "| Request | Assertion | Error |"
              echo "|---------|-----------|-------|"

              jq -r '
                .run.executions[]
                | select(.assertions != null)
                | .item.name as $request
                | .assertions[]
                | select(.error != null)
                | "| \($request) | \(.assertion // "Unknown") | \(.error.message // "Unknown error" | gsub("\\|"; "\\|") | gsub("\n"; " ")) |"
              ' reports/report.json

            fi

          } >> "$GITHUB_STEP_SUMMARY"

      # ==================================================
      # Upload reports
      # ==================================================
      - name: Upload Newman Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postman-report
          path: reports/
          if-no-files-found: warn

      # ==================================================
      # Check Newman result
      # ==================================================
      - name: Check Newman Result
        if: always()
        shell: bash
        run: |

          echo "=========================================="
          echo "Newman Final Result"
          echo "=========================================="

          echo "Newman Exit Code:"
          echo "${NEWMAN_EXIT_CODE:-unknown}"

          if [ "${NEWMAN_EXIT_CODE:-1}" != "0" ]; then

            echo ""
            echo "❌ Newman API tests failed."

            exit 1

          fi

          echo ""
          echo "✅ Newman API tests passed."
