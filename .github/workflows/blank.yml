name: Postman API Automation

on:
  workflow_dispatch:
    inputs:
      bearer_token:
        description: "Enter Bearer token (example: Bearer eyJ...)"
        required: true
        type: string

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------------------------------------------------
      # 3. Install Newman
      # ---------------------------------------------------------
      - name: Install Newman
        run: npm install -g newman

      # ---------------------------------------------------------
      # 4. Check Bearer Token
      # ---------------------------------------------------------
      - name: Check Bearer Token
        env:
          BEARER_TOKEN: ${{ inputs.bearer_token }}
        run: |
          echo "Checking Bearer token..."

          if [ -z "$BEARER_TOKEN" ]; then
            echo "❌ Token is empty"
            exit 1
          fi

          # Hide token in logs
          echo "::add-mask::$BEARER_TOKEN"

          # Accept token with or without "Bearer " prefix, remove spaces
          TOKEN_VALUE="${BEARER_TOKEN#Bearer }"
          TOKEN_VALUE="$(echo "$TOKEN_VALUE" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN_VALUE"

          if [ -z "$TOKEN_VALUE" ]; then
            echo "❌ Token value is empty"
            exit 1
          fi

          # Save raw token (without "Bearer ") for next step
          echo "TOKEN_VALUE=$TOKEN_VALUE" >> "$GITHUB_ENV"

          echo "✅ Token is ready and will be sent to Postman"

      # ---------------------------------------------------------
      # 5. Run Postman Collection
      # ---------------------------------------------------------
      - name: Run Postman Tests
        id: postman
        continue-on-error: true
        run: |
          newman run "testing yml tets.postman_collection.json" \
            --env-var "url=https://reqres.in" \
            --env-var "bearer_token=$TOKEN_VALUE" \
            --reporters cli,json \
            --reporter-json-export postman-results.json

      # ---------------------------------------------------------
      # 6. Generate GitHub Job Summary
      # ---------------------------------------------------------
      - name: Generate Postman Test Summary
        if: always()
        run: |
          echo "# API Automation Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Collection:** testing yml tets" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f postman-results.json ]; then
            echo "## Result" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **Postman result file was not generated**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # -----------------------------------------------------
          # Read statistics
          # -----------------------------------------------------

          REQUESTS=$(node -e "const r=require('./postman-results.json'); console.log(r.run.stats.requests.total || 0);")
          REQUESTS_FAILED=$(node -e "const r=require('./postman-results.json'); console.log(r.run.stats.requests.failed || 0);")
          PREREQUEST=$(node -e "const r=require('./postman-results.json'); console.log(r.run.stats.prerequestScripts.total || 0);")
          PREREQUEST_FAILED=$(node -e "const r=require('./postman-results.json'); console.log(r.run.stats.prerequestScripts.failed || 0);")
          TESTS=$(node -e "const r=require('./postman-results.json'); console.log(r.run.stats.testScripts.total || 0);")
          TESTS_FAILED=$(node -e "const r=require('./postman-results.json'); console.log(r.run.stats.testScripts.failed || 0);")
          ASSERTIONS=$(node -e "const r=require('./postman-results.json'); console.log(r.run.stats.assertions.total || 0);")
          ASSERTIONS_FAILED=$(node -e "const r=require('./postman-results.json'); console.log(r.run.stats.assertions.failed || 0);")
          ITERATIONS=$(node -e "const r=require('./postman-results.json'); console.log(r.run.stats.iterations.total || 0);")
          RESPONSE_TIME=$(node -e "const r=require('./postman-results.json'); const t=r.run.timings && r.run.timings.responseAverage; console.log(t ? Math.round(t) + ' ms' : 'N/A');")

          # -----------------------------------------------------
          # Metrics
          # -----------------------------------------------------

          echo "## Metrics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Total | Failed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Requests | $REQUESTS | $REQUESTS_FAILED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-request Scripts | $PREREQUEST | $PREREQUEST_FAILED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Scripts | $TESTS | $TESTS_FAILED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Assertions | $ASSERTIONS | $ASSERTIONS_FAILED |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # -----------------------------------------------------
          # Run information
          # -----------------------------------------------------

          echo "## Run Information" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Iterations:** $ITERATIONS" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Average Response Time:** $RESPONSE_TIME" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # -----------------------------------------------------
          # Result
          # -----------------------------------------------------

          echo "## Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ASSERTIONS_FAILED" -eq 0 ]; then
            echo "✅ **API tests passed**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **API tests failed**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Failed Tests" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Request | Assertion | Error |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");

          const result = JSON.parse(fs.readFileSync("postman-results.json", "utf8"));
          const executions = result.run.executions || [];

          const escapeMarkdown = (value) =>
            String(value).replace(/\|/g, "\\|").replace(/\r?\n/g, " ");

          for (const execution of executions) {
            const assertions = execution.assertions || [];

            for (const assertion of assertions) {
              if (!assertion.error) continue;

              let request = "Unknown request";
              if (execution.item && execution.item.request) {
                const url = execution.item.request.url;
                if (typeof url === "string") {
                  request = url;
                } else if (url && url.raw) {
                  request = url.raw;
                }
              }

              const assertionName = assertion.assertion || "Unknown assertion";
              const errorMessage = assertion.error.message || "Assertion failed";

              console.log(
                `| ${escapeMarkdown(request)} | ${escapeMarkdown(assertionName)} | ${escapeMarkdown(errorMessage)} |`
              );
            }
          }
          NODE
          fi

      # ---------------------------------------------------------
      # 7. Fail workflow if Postman failed
      # ---------------------------------------------------------
      - name: Check Postman Result
        if: always()
        run: |
          if [ "${{ steps.postman.outcome }}" != "success" ]; then
            echo "❌ Postman API tests failed"
            exit 1
          fi

          echo "✅ Postman API tests passed"
